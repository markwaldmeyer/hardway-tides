name: Fetch tides

on:
  schedule:
    - cron: '15 3 * * *'   # every night, about 04:15 UK time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download KHM Portsmouth tide feed
        run: |
          curl -fsSL -A "Mozilla/5.0 (hardway-tides)" \
            "https://sccd.royalnavy.mod.uk/api/khm/tides/portsmouth/upcoming" -o tides.new.json
          python3 -c "import json; d=json.load(open('tides.new.json')); assert isinstance(d,list) and d and 'hWtime1' in d[0], 'Unexpected feed format'"
          mv tides.new.json tides.json

      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tides.json
          git diff --staged --quiet || git commit -m "Update tide data"
          git push
