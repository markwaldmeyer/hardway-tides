name: Fetch tides

on:
  schedule:
    - cron: '15 3 * * *'   # every night, about 04:15 UK time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download KHM Portsmouth tide feed
        run: |
          curl -fsSL --retry 2 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-GB,en;q=0.9" \
            -H "Referer: https://www.royalnavy.mod.uk/" \
            -H "Origin: https://www.royalnavy.mod.uk" \
            "https://sccd.royalnavy.mod.uk/api/khm/tides/portsmouth/upcoming" -o tides.new.json
          python3 -c "import json; d=json.load(open('tides.new.json')); assert isinstance(d,list) and d and 'hWtime1' in d[0], 'Unexpected feed format'"
          mv tides.new.json tides.json

      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tides.json
          git diff --staged --quiet || git commit -m "Update tide data"
          git push
